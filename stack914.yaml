# stack build plan using GHC 9.14 installed in PATH
# https://gitlab.haskell.org/ghc/ghc/-/wikis/migration/9.14

resolver: nightly-2026-09-01
compiler: ghc-9.14

packages:
- hledger-lib
- hledger
- hledger-ui
- hledger-web

extra-deps:
# currently out of stackage:
- yesod-static-1.6.1.0  # <1.6.1.1 for https://github.com/psibi/crypton-conduit/issues/3
- yesod-test-1.6.19
- cryptonite-0.30
- cryptonite-conduit-0.2.2
